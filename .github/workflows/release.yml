name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web assets
        run: python3 build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 36 and build-tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found on the image, installing cmdline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug bundleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Save failure log for debugging
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 400 /tmp/build.log > ci-logs/last-failure.txt
          git config user.email "ci@local"
          git config user.name "CI"
          git add ci-logs/last-failure.txt
          git commit -m "ci: capture failure log [skip ci]"
          git push origin HEAD:ci-logs --force

      - name: Collect outputs
        run: |
          mkdir -p dist
          find android/app/build/outputs -name "*.apk" -exec cp {} dist/ \;
          find android/app/build/outputs -name "*.aab" -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Anas-Muslim-Build
          path: dist/*

      - name: Publish outputs to dist-output branch
        run: |
          set -e
          git config user.email "ci@local"
          git config user.name "CI"
          git checkout --orphan dist-output-tmp
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p dist-keep
          cp dist/*.apk dist/*.aab dist-keep/ 2>/dev/null || true
          mv dist-keep/* . 2>/dev/null || true
          rm -rf dist-keep dist android web
          git add -A
          git commit -m "ci: publish build outputs [skip ci]"
          git push origin dist-output-tmp:dist-output --force
