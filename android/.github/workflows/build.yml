name: Build AAB and APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release bundle and APK
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Save the files in the repository
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AnasMuslim.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/AnasMuslim.aab
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/AnasMuslim.apk dist/AnasMuslim.aab
          git commit -m "Add built files [skip ci]" || echo "nothing to commit"
          git push
