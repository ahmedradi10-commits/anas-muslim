plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

android {
    namespace 'com.anas.muslim'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anasahmedradi.anasmuslim'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.8'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'].replace('../', ''))
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // MediaPlayer reads the adhan files straight from assets, so they must stay uncompressed.
    androidResources {
        noCompress 'mp3'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
