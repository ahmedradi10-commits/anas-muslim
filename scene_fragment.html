<style>
#scene{position:fixed;inset:0;z-index:200;background:#050b1f;color:#fff;font-family:'Cairo',system-ui,sans-serif;overflow:hidden}
#scene[hidden]{display:none!important}
#sceneCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene .sc-top{background:linear-gradient(rgba(3,10,25,.5),rgba(3,10,25,0));padding-bottom:40px!important;position:absolute;inset-inline:0;top:0;text-align:center;padding:calc(44px + env(safe-area-inset-top,0px)) 24px 0;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#scene .sc-kick{font-size:18px;opacity:.92;font-weight:600}
#scene .sc-name{font-family:'Amiri',serif;font-weight:700;font-size:64px;line-height:1.25}
#scene .sc-sub{font-size:16px;opacity:.9;font-variant-numeric:tabular-nums}
#scene .sc-mid{position:absolute;inset-inline:0;top:30%;text-align:center;font-family:'Amiri',serif;padding:0 20px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#scene .sc-line{display:inline-block;max-width:100%;box-sizing:border-box;background:rgba(4,14,30,.42);border-radius:20px;padding:4px 20px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font-size:38px;line-height:1.6;font-weight:700;min-height:62px;font-variant-numeric:tabular-nums}
#scene .sc-line.pop{animation:scPop .5s ease both}
#scene .sc-next{text-shadow:0 1px 8px #000;font-size:20px;opacity:.55;margin-top:6px;min-height:30px}
#scene .sc-list{background:rgba(4,14,30,.42);border-radius:20px;padding:10px 16px;margin-inline:auto;max-width:360px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font-size:21px;line-height:1.7;opacity:.95}
@keyframes scPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
#scene .sc-stop{position:absolute;inset-inline:0;margin-inline:auto;width:max-content;bottom:calc(34px + env(safe-area-inset-bottom,0px));padding:14px 38px;border-radius:99px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:700 17px 'Cairo',system-ui,sans-serif;cursor:pointer}
</style>
<div id="scene" hidden>
  <canvas id="sceneCv"></canvas>
  <div class="sc-top"><div class="sc-kick" id="scKick"></div><div class="sc-name" id="scName"></div><div class="sc-sub" id="scSub"></div></div>
  <div class="sc-mid"><div id="scMid" class="sc-line"></div><div id="scNext" class="sc-next"></div><div id="scList" class="sc-list" hidden></div></div>
  <button class="sc-stop" id="sceneStop">إيقاف الأذان</button>
</div>
<script>
/* Animated mosque scene (original artwork drawn with canvas). The sky follows the prayer: dawn, noon, afternoon, sunset, night. */
(function(){
var host=document.getElementById('scene'),cv=document.getElementById('sceneCv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,raf=0,last=0,T=0,key='isha',stars=[],clouds=[],birds=[],onStop=null,PI=Math.PI;
var SKY={
  fajr:   {top:'#14183f',mid:'#6a4c8c',bot:'#f4a77f',night:.55,moon:true,sun:null,cloud:'#f3b9a0',sil:'#0b1a2a',ground:'#08131f',lit:.9},
  dhuhr:  {top:'#2b86d9',mid:'#79c2f1',bot:'#eaf7ff',night:0,moon:false,sun:{x:.72,y:.17,c:'255,246,200'},cloud:'#ffffff',sil:'#0f4a40',ground:'#0b3a33',lit:0},
  asr:    {top:'#4789cc',mid:'#9fc9e6',bot:'#f8e2b0',night:0,moon:false,sun:{x:.24,y:.3,c:'255,232,160'},cloud:'#fff2d6',sil:'#124338',ground:'#0c342d',lit:.1},
  maghrib:{top:'#2a1d5c',mid:'#c34f69',bot:'#ffb55c',night:.2,moon:false,sun:{x:.78,y:.64,c:'255,208,120'},cloud:'#f19a74',sil:'#1c1330',ground:'#120c20',lit:.75},
  isha:   {top:'#040a1d',mid:'#0d1e48',bot:'#1c3a6c',night:1,moon:true,sun:null,cloud:'#31456f',sil:'#050c1a',ground:'#030812',lit:1}
};
function rnd(a,b){return a+Math.random()*(b-a)}
function rgba(rgb,a){return 'rgba('+rgb+','+a+')'}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mix(a,b,t){var x=hexRgb(a),y=hexRgb(b);return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')'}

var moon=document.createElement('canvas');moon.width=moon.height=128;
(function(){var m=moon.getContext('2d');m.fillStyle='#fff1bd';m.beginPath();m.arc(64,64,48,0,2*PI);m.fill();m.globalCompositeOperation='destination-out';m.beginPath();m.arc(86,52,42,0,2*PI);m.fill()})();

function seed(){
  stars=[];for(var i=0;i<110;i++)stars.push({x:rnd(0,1),y:rnd(0,.6),r:rnd(.5,1.7),p:rnd(0,6.28),s:rnd(.8,2.2)});
  clouds=[];for(i=0;i<6;i++)clouds.push({x:rnd(-.2,1.2),y:rnd(.08,.42),s:rnd(.7,1.5),v:rnd(.004,.012)});
  birds=[];for(i=0;i<5;i++)birds.push({x:rnd(-.3,1),y:rnd(.12,.36),v:rnd(.03,.06),p:rnd(0,6)});
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=host.clientWidth||window.innerWidth;H=host.clientHeight||window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);seed();
}
window.addEventListener('resize',function(){if(!host.hidden)resize()});

function dome(cx,y0,r,h){
  ctx.beginPath();ctx.moveTo(cx-r,y0);
  ctx.bezierCurveTo(cx-r,y0-h*.62,cx-r*.32,y0-h*.78,cx,y0-h);
  ctx.bezierCurveTo(cx+r*.32,y0-h*.78,cx+r,y0-h*.62,cx+r,y0);
  ctx.closePath();ctx.fill();
}
function arch(x,y,w,h){
  ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y-h+w/2);ctx.arc(x,y-h+w/2,w/2,PI,0);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();
}
function finial(x,y,s){
  ctx.fillRect(x-1.5*s,y-2*s,3*s,26*s);
  ctx.drawImage(moon,x-12*s,y-26*s,24*s,24*s);
}
function minaret(x,by,s){
  ctx.fillRect(x-12*s,by-250*s,24*s,250*s);
  ctx.fillRect(x-19*s,by-176*s,38*s,7*s);
  ctx.fillRect(x-19*s,by-228*s,38*s,7*s);
  ctx.beginPath();ctx.moveTo(x-15*s,by-250*s);ctx.lineTo(x,by-304*s);ctx.lineTo(x+15*s,by-250*s);ctx.closePath();ctx.fill();
  finial(x,by-300*s,s*.8);
}
function mosque(S,cx,by,s){
  var hallW=380*s,hallH=84*s;
  if(S.lit>0){
    var gg=ctx.createRadialGradient(cx,by-120*s,10,cx,by-120*s,300*s);
    gg.addColorStop(0,'rgba(255,190,100,'+(.28*S.lit)+')');gg.addColorStop(1,'rgba(255,190,100,0)');
    ctx.fillStyle=gg;ctx.fillRect(cx-320*s,by-440*s,640*s,460*s);
  }
  ctx.fillStyle=S.sil;
  ctx.fillRect(cx-hallW/2,by-hallH,hallW,hallH);
  dome(cx-135*s,by-hallH,52*s,70*s);dome(cx+135*s,by-hallH,52*s,70*s);
  finial(cx-135*s,by-hallH-70*s,s*.7);finial(cx+135*s,by-hallH-70*s,s*.7);
  ctx.fillRect(cx-72*s,by-hallH-26*s,144*s,26*s);
  dome(cx,by-hallH-26*s,92*s,150*s);
  finial(cx,by-hallH-26*s-150*s,s);
  minaret(cx-222*s,by,s);minaret(cx+222*s,by,s);
  ctx.fillRect(cx-150*s,by-14*s,300*s,14*s);
  if(S.lit>0){
    ctx.fillStyle='rgba(255,214,130,'+S.lit+')';
    for(var i=-2;i<=2;i++){if(i===0)continue;arch(cx+i*62*s,by-10*s,20*s,40*s)}
    arch(cx,by-10*s,30*s,56*s);
    for(i=-2;i<=2;i++)arch(cx+i*26*s,by-hallH-4*s,10*s,18*s);
    [-222,222].forEach(function(dx){arch(cx+dx*s,by-196*s,8*s,22*s);arch(cx+dx*s,by-130*s,8*s,22*s);arch(cx+dx*s,by-70*s,8*s,22*s)});
  }
}
function cloud(x,y,s,col,a){
  ctx.fillStyle=col;ctx.globalAlpha=a;
  [[0,0,26],[22,-8,30],[48,0,24],[24,8,26]].forEach(function(c){ctx.beginPath();ctx.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,2*PI);ctx.fill()});
  ctx.globalAlpha=1;
}
function bird(x,y,p,col){
  var f=Math.sin(T*9+p)*5;
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.beginPath();
  ctx.moveTo(x-9,y+f*.4);ctx.quadraticCurveTo(x-4,y-5-f,x,y);ctx.quadraticCurveTo(x+4,y-5-f,x+9,y+f*.4);ctx.stroke();
}
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(ts-last<33)return;
  var dt=last?(ts-last)/1000:0;last=ts;T+=dt;
  var S=SKY[key]||SKY.isha,i;
  var g=ctx.createLinearGradient(0,0,0,H*.82);
  g.addColorStop(0,S.top);g.addColorStop(.55,S.mid);g.addColorStop(1,S.bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(S.night>0){
    for(i=0;i<stars.length;i++){
      var st=stars[i],a=S.night*(.45+.55*Math.sin(T*st.s+st.p));
      ctx.fillStyle='rgba(255,255,255,'+Math.max(0,a).toFixed(3)+')';
      ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.r,0,2*PI);ctx.fill();
    }
  }
  if(S.sun){
    var sx=S.sun.x*W,sy=S.sun.y*H,rg=ctx.createRadialGradient(sx,sy,0,sx,sy,W*.55);
    rg.addColorStop(0,rgba(S.sun.c,.95));rg.addColorStop(.12,rgba(S.sun.c,.55));rg.addColorStop(1,rgba(S.sun.c,0));
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=rgba(S.sun.c,1);ctx.beginPath();ctx.arc(sx,sy,W*.055,0,2*PI);ctx.fill();
  }
  if(S.moon){
    var mx=W*.76,my=H*.2,ms=W*.2,mg=ctx.createRadialGradient(mx+ms*.5,my+ms*.5,0,mx+ms*.5,my+ms*.5,ms*1.3);
    mg.addColorStop(0,'rgba(255,241,189,.32)');mg.addColorStop(1,'rgba(255,241,189,0)');
    ctx.fillStyle=mg;ctx.fillRect(mx-ms,my-ms,ms*3,ms*3);
    ctx.drawImage(moon,mx,my,ms,ms);
  }
  if(S.night<.8){
    for(i=0;i<clouds.length;i++){
      var c=clouds[i];c.x+=c.v*dt;if(c.x>1.3)c.x=-.3;
      cloud(c.x*W,c.y*H,c.s*W/420,S.cloud,.8*(1-S.night*.6));
    }
  }
  if(S.night<.6){
    for(i=0;i<birds.length;i++){
      var b=birds[i];b.x+=b.v*dt;if(b.x>1.2){b.x=-.2;b.y=rnd(.12,.36)}
      bird(b.x*W,b.y*H+Math.sin(T+b.p)*6,b.p,rgba('20,30,40',.75));
    }
  }
  // far hills
  var base=H*.8;
  ctx.fillStyle=mix(S.bot,S.sil,.45);ctx.beginPath();ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=16)ctx.lineTo(x,base-34-Math.sin(x*.011+1)*16-Math.sin(x*.027)*7);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=mix(S.bot,S.sil,.7);ctx.beginPath();ctx.moveTo(0,H);
  for(x=0;x<=W;x+=16)ctx.lineTo(x,base-14-Math.sin(x*.016+3)*10-Math.sin(x*.04)*4);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // mosque + ground
  var s=Math.min(W/540,H/780);
  mosque(S,W/2,base,s);
  var gr=ctx.createLinearGradient(0,base,0,H);gr.addColorStop(0,S.sil);gr.addColorStop(1,S.ground);
  ctx.fillStyle=gr;ctx.fillRect(0,base,W,H-base);
}
var $=function(id){return document.getElementById(id)};
$('sceneStop').onclick=function(){if(onStop)onStop()};
/*__ADH_T__*/
var LY={t:'اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ',s:'أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ',r:'أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ',h:'حَيَّ عَلَى الصَّلَاةِ',f:'حَيَّ عَلَى الْفَلَاحِ',n:'الصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ',l:'لَا إِلَٰهَ إِلَّا اللَّهُ'};
var SEQ12=['t','t','s','s','r','r','h','h','f','f','t','l'],SEQ14=['t','t','s','s','r','r','h','h','f','f','n','n','t','l'];
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
var opt={},mode='',t0=0,tm=null,seq=null,lastIdx=-2,iqEnd=0,tmr=0,doneT=0;
function setMid(txt){var m=$('scMid');if(m.getAttribute('data-t')===txt)return;m.setAttribute('data-t',txt);m.textContent=txt;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}
function tick(){
  var now=Date.now();
  if(mode==='adhan'){
    if(!tm)return;
    var pos=-1;try{pos=opt.getPos?opt.getPos():-1}catch(e){}
    if(!(pos>=0))pos=(now-t0)/1000;
    var n=seq.length,i=-1;
    for(var j=0;j<n;j++){if(pos>=tm[j]-0.05)i=j}
    if(i<0){setMid(LY[seq[0]]);$('scNext').textContent='';return}
    setMid(LY[seq[i]]);$('scNext').textContent=i+1<n?LY[seq[i+1]]:'';
  }else if(mode==='wait'){
    var s=Math.max(0,Math.ceil((iqEnd-now)/1000));
    setMid(AR(('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)));
    if(s<=300&&s>0&&(opt.iq||0)>5&&!opt._five){opt._five=true;$('scKick').textContent='الإقامة ناقص لها خمس دقائق';try{if(opt.alertFn)opt.alertFn()}catch(e){}}
    if(s<=0)iqama();
  }
}
function iqWords(m){return m===20?'ثلث ساعة':m===15?'ربع ساعة':m===30?'نصف ساعة':m===10?'عشر دقائق':m===5?'خمس دقائق':AR(m)+' دقيقة'}
function iqama(){
  mode='iqama';
  $('scKick').textContent='حان وقت الإقامة';$('scSub').textContent='';
  $('scNext').textContent='';$('scList').hidden=true;$('scMid').hidden=false;
  setMid('قَدْ قَامَتِ الصَّلَاةُ');$('sceneStop').textContent='إغلاق';
  try{if(opt.alertFn)opt.alertFn()}catch(e){}
  clearTimeout(doneT);doneT=setTimeout(function(){if(opt.onDone)opt.onDone()},45000);
}
window.Scene={
  /* o: {k, name, city, time, preview, file, iq (minutes), getPos(), alertFn(), onStop, onDone} */
  show:function(o){
    opt=o;key=SKY[o.k]?o.k:'isha';onStop=o.onStop||null;mode='adhan';t0=Date.now();lastIdx=-2;
    clearInterval(tmr);clearTimeout(doneT);
    $('scKick').textContent=o.preview?'تجربة صوت المؤذن':'حان موعد صلاة';
    $('scName').textContent=o.preview?'':(o.name||'');
    $('scSub').textContent=[o.city,o.time].filter(Boolean).join(' · ');
    $('sceneStop').textContent=o.preview?'إيقاف التجربة':'إيقاف الأذان';
    tm=(typeof ADH_T!=='undefined'&&ADH_T[o.file])||null;
    seq=tm?(tm.length===14?SEQ14:SEQ12):null;
    $('scNext').textContent='';$('scMid').setAttribute('data-t','');
    if(tm){$('scList').hidden=true;$('scMid').hidden=false;setMid(LY[seq[0]])}
    else{
      $('scMid').hidden=true;
      var L=['t','s','r','h','f'];if(o.k==='fajr'||o.file==='fajr')L.push('n');L.push('t','l');
      $('scList').innerHTML=L.map(function(x){return '<div>'+LY[x]+'</div>'}).join('');$('scList').hidden=false;
    }
    host.hidden=false;resize();T=0;last=0;
    tmr=setInterval(tick,150);
    if(!raf)raf=requestAnimationFrame(frame);
  },
  hide:function(){clearInterval(tmr);clearTimeout(doneT);mode='';host.hidden=true;if(raf){cancelAnimationFrame(raf);raf=0}},
  ended:function(){
    if(mode!=='adhan')return;
    $('scList').hidden=true;$('scMid').hidden=false;$('scNext').textContent='';
    var iq=opt.preview?0:(opt.iq||0);
    if(iq>0){
      mode='wait';iqEnd=Date.now()+iq*60000;
      opt._five=false;$('scKick').textContent='ناقص '+iqWords(iq)+' على الإقامة';$('scName').textContent='';$('scSub').textContent='تقبّل الله منا ومنكم، استعد للصلاة';
      $('sceneStop').textContent='إغلاق';tick();
    }else{
      mode='closing';setMid('تَقَبَّلَ اللَّهُ طَاعَتَكُم');$('sceneStop').textContent='إغلاق';
      clearTimeout(doneT);doneT=setTimeout(function(){if(opt.onDone)opt.onDone()},3500);
    }
  },
  visible:function(){return !host.hidden}
};
})();
</script>
